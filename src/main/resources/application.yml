spring:
  application:
    name: inventory-movement-service
  datasource:
    # Default profile: in-memory H2 (PostgreSQL mode) so the app runs with zero setup.
    url: jdbc:h2:mem:inventory;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # Flyway owns the schema
  flyway:
    enabled: true
  cache:
    type: caffeine
    cache-names: stock-levels
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

inventory:
  events:
    publisher: logging          # logging | kafka | sqs
    topic: inventory-movements  # Kafka topic
    sqs:
      queue-url: ${SQS_QUEUE_URL:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
